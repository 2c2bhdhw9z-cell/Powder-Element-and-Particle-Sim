name: Server

# The server's half of what the phone talks to — not the whole website's suite, most of which guards the web engine.
#
# Two things: the routing table (which request reaches which operation, and which need an account), and the phone
# contract — every request the phone makes, replayed through the real handler against a real database built from the
# real migrations, with the answers compared against those the phone's own tests decode. See
# web/src/lib/api/__tests__/phone-contract.test.ts and native/Tests/CrucibleCoreTests/CloudContractTests.swift.

on:
  # Pushes to any branch start this, and the job carries on only on the project's main line, whatever it is called.
  push:
    paths:
      # The browser UI is reference material, but all of `web/` can affect either that reference or the server that
      # the phone uses. Listing a handful of folders left routes, middleware, scripts and build configuration unchecked.
      - "web/**"
      - "vercel.json"
      - "native/Sources/CrucibleCore/Cloud/**"
      - "native/Tests/CrucibleCoreTests/Fixtures/phone-requests.json"
      - "native/Tests/CrucibleCoreTests/Fixtures/server-replies.json"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "web/**"
      - "vercel.json"
      - "native/Sources/CrucibleCore/Cloud/**"
      - "native/Tests/CrucibleCoreTests/Fixtures/phone-requests.json"
      - "native/Tests/CrucibleCoreTests/Fixtures/server-replies.json"
      - ".github/workflows/server.yml"
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: What the phone talks to
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Known security problems
        working-directory: web
        run: npm audit --omit=dev

      - name: Types
        working-directory: web
        run: npm run typecheck

      - name: Style
        working-directory: web
        run: npm run lint

      # The phone contract is part of this, along with all reference-engine and deployment-script checks. This used to
      # run only `src/lib/api`, so most of the code that ships in the server bundle was never checked here.
      - name: All tests
        working-directory: web
        run: npm test

      - name: Production build
        working-directory: web
        run: npm run build
