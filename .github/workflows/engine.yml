name: Engine

# The simulation engine, checked on two different operating systems.
#
# Running the same suite on Linux and on macOS is not redundancy. The engine carries its own
# sine, cosine and powers precisely so that every platform computes identical results (see
# native/Sources/CrucibleCore/Support/FDLibm.swift), and this is the check that the claim is
# true rather than merely intended. If Apple's toolchain ever produced a different answer,
# the golden comparisons would fail here — on the platform the app actually ships to.

on:
  # Pushes to any branch start this, and each job then checks that the push was to the project's main line — whatever
  # it is called at the time. This used to name the branch as `main`, and when the main line was renamed every check
  # quietly stopped running.
  push:
    paths:
      - "native/**"
      - "scripts/build-times.sh"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "native/**"
      - "scripts/build-times.sh"
      - ".github/workflows/engine.yml"
  workflow_dispatch:

concurrency:
  # A newer push supersedes an older one on the same branch.
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    # A push counts only on the main line; see the note at the top.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, so every file can be given the time it last changed. See below.
          fetch-depth: 0

      - name: Swift version
        run: swift --version

      # The last run's build, kept, so only what has changed since is compiled again. Keyed by the commit, so each run
      # keeps its own, and started from the newest one there is.
      - name: Keep the build's work between runs
        uses: actions/cache@v4
        with:
          path: native/.build
          key: swift-linux-6.2-${{ hashFiles('native/Package.swift') }}-${{ github.sha }}
          restore-keys: swift-linux-6.2-${{ hashFiles('native/Package.swift') }}-

      # A fresh checkout stamps every file with the present moment, which made a kept build look out of date in every
      # file. Why this is enough, and safe: scripts/build-times.sh.
      - name: Give every file the time it last changed
        run: |
          git config --global --add safe.directory "$PWD"
          sh scripts/build-times.sh

      - name: Build
        working-directory: native
        run: swift build --build-tests

      - name: Test
        working-directory: native
        run: swift test

      # Release as well as debug. The optimiser is entitled to reassociate floating-point
      # expressions in ways that change the last bit, and the golden comparisons are exact —
      # so "it passes in debug" is not evidence that the shipping build is correct.
      - name: Test (optimised)
        working-directory: native
        run: swift test -c release

  apple:
    name: macOS
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # The same as on Linux: the last run's build, and every file given the time it last changed.
      - name: Keep the build's work between runs
        uses: actions/cache@v4
        with:
          path: native/.build
          key: swift-macos-26-${{ hashFiles('native/Package.swift') }}-${{ github.sha }}
          restore-keys: swift-macos-26-${{ hashFiles('native/Package.swift') }}-

      - name: Give every file the time it last changed
        run: sh scripts/build-times.sh

      - name: Test
        working-directory: native
        run: swift test

      - name: Test (optimised)
        working-directory: native
        run: swift test -c release

      # Numbers from real Apple hardware rather than from a Linux container. Performance
      # claims about this port should come from here.
      - name: Benchmark
        working-directory: native
        run: swift run -c release crucible-bench

      # Fails when anything it measures has become more than half as slow again as the figure recorded for it in
      # native/bench-baseline.json. Why the limit is that wide, and what to do when slower is meant: SpeedGate.swift.
      - name: Speed check
        working-directory: native
        run: swift run -c release crucible-bench --gate bench-baseline.json
